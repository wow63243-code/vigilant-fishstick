          /// A little stitched pillow. Used as the logo and inside icons.
          struct PillowIcon: View {
              var size: CGFloat = 40

              var body: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: size * 0.34, style: .continuous)
