              var state: LineState = .active
          }

          /// Lyrics-style log: newest line at the bottom, older lines fade upward.
          struct LogView: View {
              let lines: [LogLine]

              private let opacities: [Double] = [1.0, 0.55, 0.3, 0.12, 0.0, 0.0]

              var body: some View {
                  let visible = Array(lines.suffix(6))
                  VStack(alignment: .leading, spacing: 0) {
                      Spacer(minLength: 0)
                      ForEach(Array(visible.enumerated()), id: \.element.id) { index, line in
                          let distance = visible.count - 1 - index
                          HStack(spacing: 12) {
                              iconView(for: line.state)
                              Text(line.text)
                                  .font(.system(size: 17, weight: .regular))
                                  .foregroundColor(.white)
                                  .lineLimit(1)
                              Spacer(minLength: 0)
                          }
                          .frame(height: 40)
                          .opacity(opacities[min(distance, opacities.count - 1)])
                          .transition(.move(edge: .bottom).combined(with: .opacity))
                      }
                  }
