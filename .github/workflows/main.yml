              let title: String
              let icon: String
              let action: () -> Void
          }

          struct ActionMenu: View {
              let items: [MenuItem]

              var body: some View {
                  VStack(spacing: 0) {
                      ForEach(Array(items.enumerated()), id: \.element.id) { index, item in
                          Button(action: item.action) {
                              HStack(spacing: 10) {
                                  Image(systemName: item.icon)
                                      .font(.system(size: 14, weight: .medium))
                                      .frame(width: 22)
                                  Text(item.title)
