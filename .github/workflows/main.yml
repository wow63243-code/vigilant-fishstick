          import SwiftUI

          struct TerminalLine: Identifiable {
              let id = UUID()
              let text: String
              let isInput: Bool
          }

          struct TerminalView: View {
              var onReboot: () -> Void

              @State private var lines: [TerminalLine] = TerminalView.banner
              @State private var input = ""
              @State private var cwd = "~"
              @FocusState private var focused: Bool

              private var prompt: String { "root@\(Config.hostName):\(cwd)# " }

              private static let banner: [TerminalLine] = [
                  "Pillow Escape (fake) — it does nothing, and that's the point.",
                  "Welcome to PillowOS 27.0 (arm64)",
                  "Type 'help' for a list of commands.",
                  ""
              ].map { TerminalLine(text: $0, isInput: false) }

              private let green = Color(red: 0.62, green: 1.0, blue: 0.72)

              var body: some View {
                  VStack(spacing: 0) {
                      titleBar
                      ScrollViewReader { proxy in
                          ScrollView {
                              VStack(alignment: .leading, spacing: 2) {
                                  ForEach(lines) { line in
                                      Text(line.text.isEmpty ? " " : line.text)
                                          .font(.system(size: 13, design: .monospaced))
                                          .foregroundColor(line.isInput ? Color.white : green)
                                          .frame(maxWidth: .infinity, alignment: .leading)
                                  }
                                  Color.clear.frame(height: 1).id("bottom")
                              }
                              .padding(.horizontal, 14)
                              .padding(.vertical, 10)
                          }
                          .onChange(of: lines.count) { _ in
                              withAnimation(.easeOut(duration: 0.15)) {
                                  proxy.scrollTo("bottom", anchor: .bottom)
                              }
                          }
                      }
                      inputBar
                  }
                  .background(Color.black.opacity(0.88).ignoresSafeArea())
                  .onAppear { focused = true }
              }

              private var titleBar: some View {
                  HStack {
                      Text("pillow — zsh")
                          .font(.system(size: 13, weight: .semibold, design: .monospaced))
                          .foregroundColor(Theme.textSecondary)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.vertical, 10)
                  .background(Color.white.opacity(0.06))
              }

              private var inputBar: some View {
                  HStack(spacing: 0) {
                      Text(prompt)
                          .font(.system(size: 13, weight: .semibold, design: .monospaced))
                          .foregroundColor(green)
                      TextField("", text: $input)
                          .font(.system(size: 13, design: .monospaced))
                          .foregroundColor(.white)
                          .textInputAutocapitalization(.never)
                          .disableAutocorrection(true)
                          .submitLabel(.send)
                          .focused($focused)
                          .onSubmit { run(input) }
                  }
                  .padding(.horizontal, 14)
                  .padding(.vertical, 12)
                  .background(Color.white.opacity(0.06))
              }

              // MARK: Commands

              private func emit(_ output: [String]) {
                  lines.append(contentsOf: output.map { TerminalLine(text: $0, isInput: false) })
              }

              private func run(_ raw: String) {
                  let typed = raw.trimmingCharacters(in: .whitespaces)
                  lines.append(TerminalLine(text: prompt + raw, isInput: true))
                  input = ""
                  focused = true
                  guard !typed.isEmpty else { return }

                  var parts = typed.split(separator: " ").map(String.init)
                  if parts.first == "sudo" && parts.count > 1 { parts.removeFirst() }
                  let cmd = parts[0]
                  let args = Array(parts.dropFirst())

                  switch cmd {
                  case "help":
                      emit([
                          "Available commands:",
                          "  help          show this list",
                          "  ls            list files",
                          "  pwd / cd      where am I",
                          "  whoami / id   who are you",
                          "  uname [-a]    system info",
                          "  date          the date",
                          "  pillowfetch   system info, but fluffy",
                          "  pillow        Pillow Package (try: pillow install memory-foam)",
                          "  zebra         open Zebra",
                          "  echo <text>   repeat text",
                          "  clear         clear the screen",
                          "  reboot        reboot userspace"
                      ])
                  case "ls":
                      emit(["Applications  bin  fluff  pillows  usr  var  .pillowrc"])
                  case "pwd":
                      emit([cwd == "~" ? "/var/mobile" : cwd])
                  case "cd":
                      if let target = args.first {
                          if target == ".." { cwd = "/" }
                          else if target.hasPrefix("/") || target.hasPrefix("~") { cwd = target }
                          else { cwd = (cwd == "~" ? "~" : cwd) + "/" + target }
                      } else {
                          cwd = "~"
                      }
                  case "whoami":
                      emit(["pillow"])
                  case "id":
                      emit(["uid=0(pillow) gid=0(pillow) groups=0(pillow),1(cushion),2(duvet)"])
                  case "uname":
                      if args.contains("-a") {
                          emit(["Darwin \(Config.hostName) 27.0.0 PillowOS Kernel Version 27.0.0 RELEASE_ARM64 arm64"])
                      } else {
                          emit(["Darwin"])
                      }
                  case "date":
                      emit([Date().formatted(date: .complete, time: .standard)])
                  case "echo":
                      emit([args.joined(separator: " ")])
                  case "clear":
                      lines = []
                  case "pillowfetch", "neofetch":
                      emit([
                          "   .-\"\"\"\"\"\"\"-.      root@\(Config.hostName)",
                          "  /  ~  ~  ~  \\     -------------",
                          " |  ~  fluff ~ |    OS: PillowOS 27.0 arm64",
                          "  \\  ~  ~  ~  /     Kernel: Fluffy 27.0.0",
                          "   '-.......-'      Packages: 12 (pillow)",
                          "                    Shell: zsh (fake)",
                          "                    Fluff level: 100%"
                      ])
                  case "pillow":
                      runPillow(args)
                  case "zebra":
                      emit(["Opening Zebra… 🦓", "(it's a joke app, there's nothing to open)"])
                  case "sileo":
                      emit(["zsh: command not found: sileo", "(no Sileo here. try 'zebra' or 'pillow')"])
                  case "apt", "apt-get", "dpkg":
                      emit(["E: Could not get lock /var/lib/dpkg/lock. A pillow is sleeping on it.", "Try 'pillow install <name>' instead."])
                  case "rm":
                      emit(["rm: permission denied (the pillows are load-bearing)"])
                  case "reboot", "exit", "ldrestart":
                      emit(["Rebooting userspace…"])
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) { onReboot() }
                  default:
                      emit(["zsh: command not found: \(cmd)"])
                  }
              }

              private func runPillow(_ args: [String]) {
                  guard let sub = args.first else {
                      emit(["Pillow Package 1.0", "usage: pillow <install|list> [name]"])
                      return
                  }
                  switch sub {
                  case "list":
                      emit(["memory-foam       1.0", "down-feather      2.1", "body-pillow-ng    0.9", "throw-cushion     3.4"])
                  case "install":
                      let name = args.dropFirst().first ?? "memory-foam"
                      emit([
                          "Reading package lists… Done",
                          "Fluffing \(name)…",
                          "Installed \(name) (nothing actually changed)"
                      ])
                  default:
                      emit(["pillow: unknown command '\(sub)'"])
                  }
              }
          }
