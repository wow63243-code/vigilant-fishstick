# Pillow Escape: builds an unsigned IPA from scratch on a macOS runner.
#
# This single file contains the whole app (SwiftUI sources, XcodeGen config and an icon generator).
# Put it at .github/workflows/build-ipa.yml in an empty GitHub repo, then run it from the Actions tab.
# The IPA is unsigned: sign/install it with Sideloadly, AltStore or TrollStore.

name: Build Pillow Escape IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Generate project files
        run: |
          set -e
          cat > project.yml <<'PILLOW_EOF_1'
          name: PillowEscape
          options:
            bundleIdPrefix: com.pillowescape
            deploymentTarget:
              iOS: "16.0"
            createIntermediateGroups: true
          settings:
            base:
              SWIFT_VERSION: "5.0"
              MARKETING_VERSION: "1.0"
              CURRENT_PROJECT_VERSION: "1"
          targets:
            PillowEscape:
              type: application
              platform: iOS
              sources:
                - PillowEscape
              info:
                path: Config/Info.plist
                properties:
                  CFBundleDisplayName: Pillow Escape
                  UILaunchScreen: {}
                  UIUserInterfaceStyle: Dark
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationPortraitUpsideDown
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.pillowescape.app
                  TARGETED_DEVICE_FAMILY: "1,2"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGN_STYLE: Manual
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          PILLOW_EOF_1
          mkdir -p tools
          cat > tools/make_icon.py <<'PILLOW_EOF_2'
          import math
          import sys

          from PIL import Image, ImageDraw, ImageFilter

          out_path = sys.argv[1] if len(sys.argv) > 1 else "icon.png"
          S = 1024

          # Gradient background (deep teal -> purple)
          bg = Image.new("RGB", (S, S))
          px = bg.load()
          c1, c2 = (14, 52, 54), (60, 40, 120)
          for y in range(S):
              for x in range(S):
                  t = (x + y) / (2 * S)
                  px[x, y] = tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3))

          # Soft glow blobs
          glow = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          g = ImageDraw.Draw(glow)
          g.ellipse((80, 60, 560, 540), fill=(110, 220, 170, 90))
          g.ellipse((500, 520, 980, 1000), fill=(240, 140, 190, 80))
          glow = glow.filter(ImageFilter.GaussianBlur(90))
          bg = Image.alpha_composite(bg.convert("RGBA"), glow)

          # Pillow shadow
          box = (170, 250, 854, 774)
          shadow = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(shadow).rounded_rectangle(
              (box[0], box[1] + 28, box[2], box[3] + 28), radius=190, fill=(0, 0, 0, 140)
          )
          shadow = shadow.filter(ImageFilter.GaussianBlur(28))
          bg = Image.alpha_composite(bg, shadow)

          # Pillow body with diagonal gradient
          body = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          bp = body.load()
          a, b = (255, 247, 230), (236, 214, 242)
          mask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle(box, radius=190, fill=255)
          for y in range(box[1], box[3]):
              for x in range(box[0], box[2]):
                  t = ((x - box[0]) + (y - box[1])) / ((box[2] - box[0]) + (box[3] - box[1]))
                  bp[x, y] = tuple(int(a[i] + (b[i] - a[i]) * t) for i in range(3)) + (255,)
          body.putalpha(mask)
          bg = Image.alpha_composite(bg, body)

          d = ImageDraw.Draw(bg)
          d.rounded_rectangle(box, radius=190, outline=(255, 255, 255, 170), width=8)

          # Dashed stitches along an inset rounded rectangle
          inset = 56
          l, t, r, bt = box[0] + inset, box[1] + inset, box[2] - inset, box[3] - inset
          rad = 190 - inset
          pts = []


          def arc(cx, cy, a0, a1, n=24):
              for i in range(n + 1):
                  ang = math.radians(a0 + (a1 - a0) * i / n)
                  pts.append((cx + rad * math.cos(ang), cy + rad * math.sin(ang)))


          pts.append((l + rad, t))
          pts.append((r - rad, t))
          arc(r - rad, t + rad, -90, 0)
          pts.append((r, bt - rad))
          arc(r - rad, bt - rad, 0, 90)
          pts.append((l + rad, bt))
          arc(l + rad, bt - rad, 90, 180)
          pts.append((l, t + rad))
          arc(l + rad, t + rad, 180, 270)
          pts.append((l + rad, t))

          seg = []
          for i in range(len(pts) - 1):
              x0, y0 = pts[i]
              x1, y1 = pts[i + 1]
              dist = math.hypot(x1 - x0, y1 - y0)
              n = max(1, int(dist // 4))
              for k in range(n):
                  seg.append((x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n))

          dash, gap = 22, 18
          i = 0
          while i < len(seg):
              chunk = seg[i : i + dash // 4 + 1]
              if len(chunk) > 1:
                  d.line(chunk, fill=(60, 40, 90, 120), width=7)
              i += (dash + gap) // 4

          # Center button tuft
          cx, cy = (box[0] + box[2]) // 2, (box[1] + box[3]) // 2
          d.ellipse((cx - 30, cy - 30, cx + 30, cy + 30), fill=(60, 40, 90, 110))
          for ang in range(0, 360, 45):
              x2 = cx + 110 * math.cos(math.radians(ang))
              y2 = cy + 110 * math.sin(math.radians(ang))
              d.line((cx, cy, x2, y2), fill=(60, 40, 90, 55), width=5)

          # App Store icons must not have an alpha channel
          bg.convert("RGB").save(out_path)
          print("icon written to", out_path)
          PILLOW_EOF_2
          mkdir -p PillowEscape/Assets.xcassets
          cat > PillowEscape/Assets.xcassets/Contents.json <<'PILLOW_EOF_3'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          PILLOW_EOF_3
          mkdir -p PillowEscape/Assets.xcassets/AppIcon.appiconset
          cat > PillowEscape/Assets.xcassets/AppIcon.appiconset/Contents.json <<'PILLOW_EOF_4'
          {
            "images" : [
              {
                "filename" : "icon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          PILLOW_EOF_4
          mkdir -p PillowEscape
          cat > PillowEscape/Config.swift <<'PILLOW_EOF_5'
          import SwiftUI

          /// Everything you might want to tweak lives here.
          enum Config {
              static let appName = "Pillow Escape"
              static let supportString = "iOS 16.0 – 27.0 (arm64e)"
              static let credit = "Made with pillows"
              static let hostName = "pillow"
          }

          enum Theme {
              /// Dopamine's default action menu color (#3F3F3F at ~45% alpha).
              static let panel = Color(.sRGB, red: 63.0 / 255.0, green: 63.0 / 255.0, blue: 63.0 / 255.0, opacity: 114.0 / 255.0)
              static let textSecondary = Color.white.opacity(0.6)
              static let textTertiary = Color.white.opacity(0.5)
          }

          struct PackageManager: Identifiable, Hashable {
              let id: String
              let name: String

              /// No Sileo here, on purpose.
              static let all: [PackageManager] = [
                  PackageManager(id: "zebra", name: "Zebra"),
                  PackageManager(id: "pillow", name: "Pillow Package")
              ]
          }
          PILLOW_EOF_5
          mkdir -p PillowEscape
          cat > PillowEscape/PillowEscapeApp.swift <<'PILLOW_EOF_6'
