              }
          }

          /// Small animated double-helix like the one next to "Jailbreaking".
          struct HelixIndicator: View {
              var body: some View {
                  TimelineView(.animation) { context in
                      let t = context.date.timeIntervalSinceReferenceDate
                      Canvas { gc, size in
                          let count = 6
                          let radius: CGFloat = 1.7
                          for i in 0..<count {
                              let x = size.width * CGFloat(i) / CGFloat(count - 1)
                              let phase = t * 3.0 + Double(i) * 0.9
                              let offset = CGFloat(sin(phase)) * size.height * 0.35
                              let y1 = size.height / 2 + offset
                              let y2 = size.height / 2 - offset
                              let r1 = CGRect(x: x - radius, y: y1 - radius, width: radius * 2, height: radius * 2)
                              let r2 = CGRect(x: x - radius, y: y2 - radius, width: radius * 2, height: radius * 2)
                              gc.fill(Path(ellipseIn: r1), with: .color(Color.white.opacity(0.95)))
                              gc.fill(Path(ellipseIn: r2), with: .color(Color.white.opacity(0.45)))
                          }
                      }
                  }
                  .frame(width: 30, height: 12)
              }
          }
          PILLOW_EOF_7
          mkdir -p PillowEscape
          cat > PillowEscape/HomeParts.swift <<'PILLOW_EOF_8'
          import SwiftUI

          struct PanelBackground: View {
              var body: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: 14, style: .continuous).fill(.ultraThinMaterial)
                      RoundedRectangle(cornerRadius: 14, style: .continuous).fill(Theme.panel)
                  }
              }
          }

          struct HeaderView: View {
              var body: some View {
                  VStack(alignment: .leading, spacing: 2) {
