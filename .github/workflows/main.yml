          cat > PillowEscape/RootView.swift <<'PILLOW_EOF_9'
          import SwiftUI

          enum Phase {
              case home, picker, jailbreaking, terminal
          }

          struct RootView: View {
              @State private var phase: Phase = .home
              @State private var expanded = false
              @State private var showTitle = false
              @State private var selected: Set<String> = ["pillow"]
              @State private var lines: [LogLine] = []
              @State private var blackout = false
              @State private var showSettings = false
              @State private var showCredits = false
              @State private var infoMessage = ""
              @State private var showInfo = false

              var body: some View {
                  ZStack {
                      BackgroundView()
                      if phase == .terminal {
                          TerminalView(onReboot: reboot)
                              .transition(.opacity)
                      } else {
                          GeometryReader { geo in
                              layout(geo)
                          }
                          .ignoresSafeArea()
                      }
                      Color.black
                          .opacity(blackout ? 1 : 0)
                          .ignoresSafeArea()
                          .allowsHitTesting(false)
                  }
                  .sheet(isPresented: $showSettings) { SettingsView() }
                  .sheet(isPresented: $showCredits) { CreditsView() }
                  .alert(infoMessage, isPresented: $showInfo) {
                      Button("OK", role: .cancel) {}
                  }
              }

              // MARK: Layout

              @ViewBuilder
              private func layout(_ geo: GeometryProxy) -> some View {
                  let w = geo.size.width
                  let h = geo.size.height
                  let statusBar = max(15, geo.safeAreaInsets.top - 20)
                  let stackH = h * 0.73
                  let centerY = h / 2 + statusBar
                  let buttonCenterY = centerY + stackH / 2 - 30
                  let topPadding = h * 0.26 + 35
                  let expandedHeight = h - topPadding + 100
                  let contentW = min(w - 40, 520)

                  ZStack {
                      VStack(alignment: .leading, spacing: 0) {
                          HeaderView()
                              .offset(y: expanded ? -25 : 0)
                          Spacer(minLength: 0)
                          ActionMenu(items: menuItems)
                              .opacity(expanded ? 0 : 1)
                              .allowsHitTesting(!expanded)
                          Spacer(minLength: 0)
                          Color.clear.frame(height: 60)
                      }
                      .frame(width: contentW, height: stackH)
                      .position(x: w / 2, y: centerY)

                      panel(width: expanded ? w : contentW, height: expanded ? expandedHeight : 60)
                          .position(x: w / 2, y: expanded ? topPadding + expandedHeight / 2 : buttonCenterY)
                  }
                  .frame(width: w, height: h)
              }

              private var menuItems: [MenuItem] {
                  [
                      MenuItem(id: "settings", title: "Settings", icon: "gearshape") { showSettings = true },
                      MenuItem(id: "respring", title: "Restart SpringBoard", icon: "arrow.clockwise") {
                          info("SpringBoard restarted.\n(Just kidding. Nothing happened.)")
                      },
                      MenuItem(id: "userspace", title: "Reboot Userspace", icon: "arrow.clockwise.circle") {
                          info("Userspace rebooted.\n(Also a joke. The pillows stay put.)")
                      },
                      MenuItem(id: "credits", title: "Credits", icon: "info.circle") { showCredits = true }
                  ]
              }

              private func panel(width: CGFloat, height: CGFloat) -> some View {
                  ZStack(alignment: .top) {
                      PanelBackground()
                      Button(action: startExpand) {
                          HStack(spacing: 10) {
                              Image(systemName: "lock.open")
                                  .font(.system(size: 14, weight: .medium))
                              Text("Jailbreak")
                                  .font(.system(size: 16, weight: .medium))
                          }
                          .foregroundColor(Color.white.opacity(0.75))
                          .frame(maxWidth: .infinity, maxHeight: .infinity)
                          .contentShape(Rectangle())
                      }
                      .opacity(expanded ? 0 : 1)
                      .disabled(expanded)

                      if expanded {
                          expandedContent
                      }
                  }
                  .frame(width: width, height: height)
              }

              private var expandedContent: some View {
                  ZStack(alignment: .top) {
                      if showTitle {
                          HStack(spacing: 10) {
                              HelixIndicator()
                              Text("Jailbreaking")
                                  .font(.system(size: 18, weight: .regular))
                                  .foregroundColor(.white)
                          }
                          .padding(.top, 20)
                          .transition(.opacity)
                      }
                      if phase == .picker {
                          PackagePickerView(selected: $selected, onContinue: startJailbreak)
                              .transition(.opacity)
                      } else if phase == .jailbreaking {
                          LogView(lines: lines)
                      }
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  // The panel runs 100pt past the bottom of the screen (hides the corners), so pad it back.
                  .padding(.bottom, 100)
              }

              // MARK: Actions

              private func info(_ message: String) {
                  infoMessage = message
                  showInfo = true
              }

              private func startExpand() {
                  withAnimation(.spring(response: 0.75, dampingFraction: 0.9)) {
                      expanded = true
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.25) {
                      withAnimation(.easeOut(duration: 0.2)) { showTitle = true }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.4) {
                      withAnimation(.easeOut(duration: 0.25)) { phase = .picker }
                  }
              }

              private func startJailbreak() {
                  Task { @MainActor in
                      withAnimation(.easeOut(duration: 0.25)) { phase = .jailbreaking }
                      await runLog()
                  }
              }

              private func pause(_ seconds: Double) async {
                  try? await Task.sleep(nanoseconds: UInt64(seconds * 1_000_000_000))
              }

              @MainActor
              private func runLog() async {
                  lines = []

                  func push(_ text: String) {
                      withAnimation(.easeOut(duration: 0.3)) {
                          for i in lines.indices { lines[i].state = .done }
                          lines.append(LogLine(text: text))
                      }
                  }
                  func update(_ text: String) {
                      guard !lines.isEmpty else { return }
                      lines[lines.count - 1].text = text
                  }

                  let chosen = PackageManager.all.filter { selected.contains($0.id) }.map { $0.name }

                  push("Checking pillow compatibility")
                  await pause(1.0)
                  push("Escaping the sim-sim box using eternal export")
                  await pause(1.7)
                  push("Gathering fluff from the kernel")
                  await pause(1.2)
                  push("Stuffing pillows into the system")
                  for pct in stride(from: 0, through: 96, by: 8) {
                      update("Stuffing pillows into the system… \(pct)%")
                      await pause(0.12)
                  }
                  update("Stuffing pillows into the system… 100%")
                  await pause(0.5)
                  for name in chosen {
                      push("Installing \(name)")
                      await pause(1.2)
                  }
                  push("Making the system pillowfull")
                  await pause(1.4)
                  push("Rebooting userspace")
                  await pause(1.2)
                  push("Done")
                  withAnimation(.easeOut(duration: 0.3)) {
                      for i in lines.indices { lines[i].state = .success }
                  }
                  await pause(1.3)

                  withAnimation(.easeIn(duration: 0.6)) { blackout = true }
                  await pause(0.8)
                  phase = .terminal
                  await pause(0.1)
                  withAnimation(.easeOut(duration: 0.6)) { blackout = false }
              }

              private func reboot() {
                  withAnimation(.easeIn(duration: 0.4)) { blackout = true }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
                      phase = .home
                      expanded = false
                      showTitle = false
                      lines = []
                      withAnimation(.easeOut(duration: 0.5)) { blackout = false }
                  }
              }
          }
